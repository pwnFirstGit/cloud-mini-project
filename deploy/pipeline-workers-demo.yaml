# Demo: two in-cluster labelling workers at the same time (Task 1 evidence).
# Each processes 20 commands from a 40-command demo pool and writes its own
# shard object to a SEPARATE bucket (teacher-demo) so the real Kaggle shards
# in s3://datasets/teacher/ are untouched.
#
# Setup (run once):
#   head -40 student_kit/data/commands_pool.jsonl > demo_pool.jsonl
#   AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test aws --endpoint-url http://localhost:8333 s3 mb s3://teacher-demo
#   kubectl create configmap demo-pool --from-file=demo_pool.jsonl -n pipeline
# Apply:
#   kubectl apply -f deploy/pipeline-workers-demo.yaml
# Watch:
#   kubectl get pods -n pipeline -w
# Verify (after both Jobs show 1/1 COMPLETE):
#   kubectl get jobs -n pipeline
#   AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test aws --endpoint-url http://localhost:8333 s3 ls s3://teacher-demo/teacher/
apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-worker-demo-0
  namespace: pipeline
spec:
  backoffLimit: 100
  template:
    spec:
      containers:
        - name: worker
          image: teacher-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - {name: SHARD_COUNT, value: "2"}
            - {name: SHARD_INDEX, value: "0"}
            - {name: OLLAMA_HOST, value: "http://host.docker.internal:11434"}
            - {name: POOL, value: "/app/demo/demo_pool.jsonl"}
            - {name: TEACHER_OUT, value: "/app/datasets/teacher/demo"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data:8333"}
            - {name: S3_BUCKET, value: "teacher-demo"}
            - name: S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: s3-creds, key: access-key}}
            - name: S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: s3-creds, key: secret-key}}
          volumeMounts:
            - {name: demo-pool, mountPath: /app/demo}
            - {name: out, mountPath: /app/datasets/teacher}
      volumes:
        - name: demo-pool
          configMap: {name: demo-pool}
        - name: out
          persistentVolumeClaim: {claimName: teacher-out}
      restartPolicy: Never
---
apiVersion: batch/v1
kind: Job
metadata:
