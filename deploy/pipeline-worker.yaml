apiVersion: v1
kind: Namespace
metadata:
  name: pipeline
---
apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-worker-0
  namespace: pipeline
spec:
  template:
    spec:
      containers:
        - name: worker
          image: teacher-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - {name: SHARD_COUNT, value: "2"}
            - {name: SHARD_INDEX, value: "0"}
            - {name: OLLAMA_HOST, value: "http://host.docker.internal:11434"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data:8333"}
            - {name: S3_BUCKET, value: "datasets"}
            - name: S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: s3-creds, key: access-key}}
            - name: S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: s3-creds, key: secret-key}}
          volumeMounts:
            - {name: pool, mountPath: /app/student_kit/data}
      volumes:
        - name: pool
          configMap: {name: commands-pool}
      restartPolicy: Never
---
apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-worker-1
  namespace: pipeline
spec:
  template:
    spec:
      containers:
        - name: worker
          image: teacher-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - {name: SHARD_COUNT, value: "2"}
            - {name: SHARD_INDEX, value: "1"}
            - {name: OLLAMA_HOST, value: "http://host.docker.internal:11434"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data:8333"}
            - {name: S3_BUCKET, value: "datasets"}
            - name: S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: s3-creds, key: access-key}}
            - name: S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: s3-creds, key: secret-key}}
          volumeMounts:
            - {name: pool, mountPath: /app/student_kit/data}
      volumes:
        - name: pool
          configMap: {name: commands-pool}
      restartPolicy: Never
