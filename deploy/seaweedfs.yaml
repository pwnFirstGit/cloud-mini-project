# SeaweedFS in namespace data (Task 1/3): master + volume + filer with
# S3 API on port 8333. After applying, create buckets `datasets` and
# `models` (filer UI or `s3cmd`), then upload commands_pool.jsonl to
# datasets/ and trained models to models/v1, models/v2.
# Minimal single-node setup for the laptop — not a production topology.
apiVersion: v1
kind: Namespace
metadata:
  name: data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels: {app: seaweedfs}
  template:
    metadata:
      labels: {app: seaweedfs}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          args: ["server", "-dir=/data", "-s3"]
          ports:
            - {containerPort: 8333, name: s3}
            - {containerPort: 8888, name: filer}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: data
spec:
  selector: {app: seaweedfs}
  ports:
    - {name: s3, port: 8333, targetPort: 8333}
    - {name: filer, port: 8888, targetPort: 8888}
