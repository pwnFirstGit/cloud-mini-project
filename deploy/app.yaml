# Task 4 — namespace app: Deployment (2 replicas), Service, Ingress /parse,
# HPA min 1 max 2 at 70% CPU. Liveness on /healthz, readiness on /readyz.
# Image: build with `docker build -t parser:v1 -f service/Dockerfile .`
# and `k3d image import parser:v1 -c cs3081` (or push to a registry).
# Secrets (S3 credentials) come from a Kubernetes Secret — never in git.
apiVersion: v1
kind: Namespace
metadata:
  name: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels: {app: parser}
  template:
    metadata:
      labels: {app: parser}
    spec:
      containers:
        - name: parser
          image: parser:v1
          ports: [{containerPort: 8000}]
          env:
            - {name: MODEL_URI, value: "s3://models/v1"}
            - {name: MODEL_VERSION, value: "v1"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data:8333"}
            - {name: MAX_NEW_TOKENS, value: "64"}
            - name: S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: s3-creds, key: access-key}}
            - name: S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: s3-creds, key: secret-key}}
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "1", memory: 1Gi}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: parser
  namespace: app
spec:
  selector: {app: parser}
  ports:
    - {port: 80, targetPort: 8000}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parser
  namespace: app
spec:
  rules:
    - http:
        paths:
          - path: /parse
            pathType: Prefix
            backend:
              service: {name: parser, port: {number: 80}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: parser
  namespace: app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: parser
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
